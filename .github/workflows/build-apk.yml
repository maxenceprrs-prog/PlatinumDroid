name: Build Pokemon Platinum Standalone APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Build Standalone APK via NDK toolchain
        run: |
          cd mobile-port/android
          chmod +x build_apk.sh
          sed -i 's/\r$//' build_apk.sh
          ./build_apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonPlatinum-Release-APK
          path: mobile-port/android/PokemonPlatinum_Release.apk
          if-no-files-found: error
